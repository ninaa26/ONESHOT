# ===================================================================
# 2-m Autonomous Sailboat – Proof-of-Concept Configuration
# Dimensions   : LOA ≈ 2.0 m, Beam ≈ 0.60 m
# Displacement : ~27 kg (hull + rig + electronics + ballast)
# Coordinate   : body-fixed (x fwd, y starboard, z down)
# All units    : SI (m, kg, s, rad, N, N·m)
# ===================================================================

simulation:
  dt:       0.02        # [s] solver step (50 Hz)
  t_final:  30.0        # [s] default sim length for scripts

# ─────────────────────────── Boat Mass & Hull ──────────────────────
boat:
  # — Mass properties —
  m:        27.0         # [kg]       dry + ballast
  Iz:       10.0         # [kg·m²]    yaw inertia  (≈ m·(L²+B²)/12)
  # — Linear viscous drag —
  Xu1:      20.0         # [N·s/m]    surge
  Yv1:      40.0         # [N·s/m]    sway
  Nr1:      15.0         # [N·m·s/rad] yaw
  # — Quadratic (form + wave) drag —
  Xu2:      8.0          # [N·s²/m²]
  Yv2:      15.0
  Nr2:      5.0
  # — Added mass (small but non-zero) —
  A_uu:     5.0          # [kg]
  A_vv:     8.0
  A_rr:     2.0          # [kg·m²]
  # — Hull leeway lift (set small: keel carries main load) —
  rho_water: 1000        # [kg/m³] seawater
  S_lat:     0.08        # [m²]  hull lateral area (exclude keel)
  CY_beta:   1.0         # [-]   small lift slope
  beta_lim_deg: 10       # [deg] hull stall
  x_CLR:    -0.10        # [m]   CLR ~10 cm aft of CG

# ─────────────────────────── Keel Foil ─────────────────────────────
keel:
  rho_water: 1000
  S_k:       0.15        # [m²]    planform area (fin + bulb strut)
  x_k:      -0.25        # [m]     keel force arm (aft, negative)
  stall_deg: 15
  airfoil_name: NACA0012 
  CL_max:    1.0         
  CD0:       0.01
  k_ind:     0.02

# ─────────────────────────── Rudder Foil ───────────────────────────
rudder:
  rho_water: 1000
  S_r:       0.05        # [m²]    rudder planform
  x_r:      -1.00        # [m]     distance CG→rudder (aft)
  delta_max_deg: 30
  stall_deg: 20
  airfoil_name: NACA0012
  CL_max:    1.0
  CD0_r:     0.02
  k_ind_r:   0.9

# # ─────────────────────────── Sail  ────────────────────────────────
# sail:
#   rho_air:   1.225
#   S_s:       1.2         # [m²]   main + jib projected area
#   x_s:       0.30        # [m]    CG→sail centre (fwd positive)
#   stall_deg: 25
#   CL_max:    1.1
#   CD0:       0.02
#   k_ind:     0.03
#   airfoil_name: NACA0012

# ─────────────────────────── Sailblade  ────────────────────────────────

# These coefficients define a blade-element sail. Either blade element sail or airfoil sail can be used in the simulation 
sail:
  rho_air: 1.225
  S_s: 1.2          # sail area [m^2]
  x_s: 0.30         # yaw lever [m]
  AR: 4.0           # aspect ratio (≈ b^2 / S)
  span: 2.2         # optional; if omitted, computed from AR and S
  nel: 12           # blade elements
  CL_alpha: 6.0     # per rad (≈ 2π reduced by losses)
  stall_deg: 25
  CD0: 0.02
  k_prof: 0.01
  e_oswald: 0.8
  twist_root_deg: 0
  twist_tip_deg: 12
  delta_max_deg: 85


# ─────────────────────────── Environment Defaults ──────────────────
environment:
  wind_speed:   4.0      # [m/s] (≈ 8 kts)
  wind_dir_deg: 0.0      # from +x (east) in N-E frame
