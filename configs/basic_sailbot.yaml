simulation:
  dt: 0.02  # [s] solver step

boat:
  mass: 27.0       # [kg]
  inertia_z: 10.0  # [kg·m²] yaw inertia

hull:
  rho_water: 1000
  S_hull: 0.5  # [m²]    planform area (fin + bulb strut)
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  xu1:      20.0         # [N·s/m]    surge
  yv1:      40.0         # [N·s/m]    sway
  nr1:      15.0         # [N·m·s/rad] yaw
  xu2:      4.0          # [N·s²/m²]
  yv2:      20.0
  nr2:      10.0

keel:
  airfoil_name: NACA0012
  model_type: keel
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [1e5]
  area: 0.5    # [m²]    planform area (fin + bulb strut)
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation

sail:
  model_type: sail
  area: 10.0
  wind_speed: 10
  wind_dir_deg: 90  # direction wind blows TO (deg, 0=east, 90=north)
  x_pos: 0.0
  y_pos: 0.0
  # Hybrid aerodynamic model (CL_max, CD0, CD1)
  CL_max: 1.2
  CD0: 0.1
  CD1: 1.0
  
rudder:
  airfoil_name: NACA0012
  model_type: keel
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [1e5]
  area: 0.3    # [m²]    planform area (fin + bulb strut)
  x_pos: -0.5  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation

  