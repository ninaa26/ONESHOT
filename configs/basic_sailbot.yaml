simulation:
  dt: 0.02  # [s] solver step

boat:
  mass: 27.0       # [kg]
  inertia_z: 10.0  # [kg·m²] yaw inertia

# Keel foil
keel:
  airfoil_name: NACA0012
  model_type: keel
  alpha_min: -25 # Minimum and maximum angle of attack in degrees
  alpha_max: 25
  res: [1e5]
  area: 0.5    # [m²]    planform area (fin + bulb strut)
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation

sail:
  airfoil_name: NACA0012
  model_type: sail
  alpha_min: -90
  alpha_max: 90
  res: [1e5]
  area: 5.0
  # TODO: remove after global wind speed/wind dir is created
  wind_speed: 0.
  wind_dir_deg: 0.
  
rudder:
  airfoil_name: NACA0012
  model_type: keel
  alpha_min: -25 # Minimum and maximum angle of attack in degrees
  alpha_max: 25
  res: [1e5]
  area: 0.3    # [m²]    planform area (fin + bulb strut)