# Geometry measured from "Full Boat Assembly Final.SLDASM"; mass properties built
# bottom-up from the Fall 2025 mech report's materials. Positions are relative to
# the mass-weighted CG (= LCB), NOT the CAD's volume-weighted CG 92 mm forward.
# Provenance, method and caveats: scripts/solidworks/flingo_floty_measured.yaml
simulation:
  dt: 0.02  # [s] solver step

environment:
  # Fluid densities. The hub injects these into every component, so this is the
  # only place either number is set; components no longer each default their own.
  rho_water: 1000.0  # [kg/m³]  fresh water
  rho_air: 1.225     # [kg/m³]  sea-level air
  nu_water: 1.0e-6   # [m²/s]   kinematic viscosity, ~20 C; matches the foil Re above

boat:
  mass: 27.0       # [kg]
  # Bottom-up from the report's materials, not the CAD mass properties: the CAD
  # densities are wrong (keel and rudder both compute to 1000 kg/m³), which gave
  # 7.391. Band is 3.1-4.1 depending on how the 15 kg of bench plates are laid
  # out; that layout is the single biggest lever on yaw response.
  inertia_z: 3.4  # [kg·m²] yaw about the vertical through the CG

hull:
  model_type: measured  # Hughes friction line + added mass from the sections below
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  L: 1.372  # [m] length of waterline, at the floating waterline for 27 kg
  # Residuary (wave-making) resistance. Calibrated 2026-09-17 against the
  # resistance curve, not guessed: at 0.01 the term was too weak to do the job
  # its own comment claimed. Residuary only overtook friction at Fn 0.47 (a
  # displacement hull crosses at 0.30-0.35), specific resistance R/W ran about
  # half the published band at every speed, and the boat topped out at Fn 0.63
  # on a hull whose DLR is ~292. At 0.05 the polar peak is 1.80 m/s = Fn 0.489,
  # inside the 0.45-0.50 a displacement hull should cap at. 0.08 gives Fn 0.453
  # if a more central value is wanted; it costs ~0.13 m/s off the whole polar.
  c_wave: 0.05
  # Yaw damping, as a cross-flow Cd. Strip theory says this should equal
  # cross_flow_cd (1.0) and it defaults to that, but the model has no term for
  # the circulatory lift a yawing hull sheds, so the derived value leaves the
  # boat badly under-damped: full rudder produced 99 deg/s against a real
  # 15-40, it turned inside 1.5 LWL against a real 2-4, and a tack cost 96% of
  # boat speed against a real 40-70%. Swept 2026-09-17 over 1-14; 7.0 is the
  # only region where all four measurements land in band at once:
  #   max yaw 40 deg/s (15-40) | turning circle 3.95 LWL (2-4)
  #   speed held in turn 75%   | speed held through a tack 37% (30-60)
  # (Re-measured after cn_plate became aspect-ratio dependent, which took some
  # damping out of the stalled foils and moved these to the top of their bands.)
  # Below 6 the tack collapses again; above 10 the turning circle opens past
  # 4 LWL. Straight-line speed is untouched across the whole sweep. A
  # measured turning circle should replace this.
  yaw_damping_cd: 7.0
  B: 0.492  # [m] beam at waterline
  T: 0.110  # [m] hull draft (canoe body, not to keel tip)
  # Measured hull skin below the waterline. The 1.7*L*(B+T) approximation this
  # replaces gives 1.404 m², about 2.5x the real area, and so overstated friction
  # drag by the same factor. Omit the key to fall back to the approximation.
  wetted_surface_m2: 0.571
  # Measured stations for added mass, sim frame (+x forward of the CG). From the
  # same hydrostatics run as the wetted surface; draft is the local submerged
  # depth. Integrating rho*pi*T^2 over these gives sway added mass 28.1 kg
  # against a 27.0 kg boat, and yaw added inertia 2.14 kg.m^2 against 3.4.
  sections:
    - {x_m:  0.693, draft_m: 0.031}
    - {x_m:  0.513, draft_m: 0.067}
    - {x_m:  0.337, draft_m: 0.092}
    - {x_m:  0.157, draft_m: 0.108}
    - {x_m: -0.019, draft_m: 0.108}
    - {x_m: -0.199, draft_m: 0.093}
    - {x_m: -0.375, draft_m: 0.062}

keel:
  # Thicker section (12%) gives better L/D at boat Re than NACA0006 (6%)
  airfoil_name: NACA0010
  model_type: finite_span
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [2.6e5]  # Re = V*c/nu at 1.5 m/s on the measured 0.175 m mean chord
  area: 0.1225  # [m²]    planform area (STL projected silhouette)
  # Measured: hull underside to tip. Geometric AR 4.00; with the hull acting as
  # an end plate the effective AR is 8.0, so this is a deep, efficient fin.
  span: 0.700   # [m]     submerged span below the hull
  end_plate_factor: 2.0  # root sealed against the hull -> mirrored flow
  # Post-stall: blend towards a flat plate rather than trusting the section polar
  # where it has no meaning. The NACA0010 table at this Re stalls near 10-11 deg
  # and alpha_sep 25 sets how fast the blend then takes over; the plate it blends
  # into carries CN 1.25 here, from the aspect ratio, not the 2-D 2.0.
  alpha_sep_deg: 25.0
  x_pos: 0.184  # [m]    forward of the CG (CG = LCB, fixed by level flotation)
  y_pos: 0.0  # [m]     y position relative to boat center of rotation

sail:
  # ORC VPP coefficient envelope against apparent wind angle. The alternative,
  # `basic`, looks a symmetric NACA section up at a geometric angle of attack,
  # which is the wrong shape for a cambered membrane.
  model_type: orc_w_jib
  # Flingo is a sloop, not the single-sail rig the earlier notes assumed:
  # main 1.196 m² (luff 2.326, AR 4.53) + jib 0.775 m² (luff 2.260, AR 6.59).
  # `orc_w_jib` is the main-and-jib model (`orc_main` is mainsail only and will
  # refuse a jib_area). The simulator carries one sail, so `area` is the
  # combined reference area and `jib_area` tells the model how much of it to
  # look up in the jib table (ORC 5.4.1: coefficients blend by area share).
  area: 1.971  # [m²]    main + jib; sail area / displacement^(2/3) = 21.9
  jib_area: 0.775  # [m²]  measured; 39% of the rig
  wind_speed: 5
  wind_dir_deg: 90  # direction wind blows TO (deg, 0=east, 90=north)
  # NOTE: the rig's span and endplate are NOT config keys here. ORC charges
  # induced drag against heff and eff_span_corr below, not against a geometric
  # aspect ratio, so `span` and `end_plate_factor` would be read by nothing --
  # the sail model now refuses them rather than carry them. The measurements
  # they used to hold are kept for the record: masthead 2.592 m above the
  # waterline (geometric AR 3.41 on the combined area), the jib deck-sweeping
  # and the main with a 0.086 m foot gap.
  # Rig height for ORC induced drag: measured masthead above the waterline,
  # ORC's (b + HBI). Both sails hang from roughly this height.
  heff: 2.592   # [m]
  # ORC 5.4.3 does not use that height as-is. Close-hauled the deck-sweeping
  # jib seals against the hull and the two sails work as one taller wing, so
  # the effective height peaks at 20 deg AWA (Figure 5.14) and falls to 0.80x
  # once the sheets are eased past 80. Induced drag goes as 1/heff^2, so
  # holding heff at the masthead over-charged the rig on a beat.
  #
  # Which edition of the curve is a choice, and it is made here on purpose:
  #   orc-2022  peak 1.22   used with ORC's milder depowering (min flat 0.62)
  #   orc-2023  peak 1.45   raised as a package WITH deeper depowering (0.42)
  # This boat has no righting-moment limit yet, so it cannot pay the 2023
  # package's other half. Stay on 2022 until max_heeling_moment_nm is set,
  # then move to 2023. Unset, heff is constant.
  heff_model: orc-2022
  # ORC eq. 5.42 sail-plan correction, from the measured rig:
  #   roach         0.000  main area 1.1955 equals 0.5 * luff * foot exactly
  #   fractionality 0.937  jib head 2.260 / main head 2.412, both above deck
  #   overlap       1.0    ASSUMED: LP = 0.686 = foot, J not in the CAD notes
  #   1.1 + 0.08*(0 - 0.2) + 0.5*(0.68 + 0.31*0.937 + 0.075*1.0 - 1.1)
  eff_span_corr: 1.057
  # ORC depowering. Both keys together, or neither. UNSET because the righting
  # moment is not measured: the CAD CG sits 0.17 m ABOVE the waterline, which
  # would give GM ~0.09 m, but that rests on the densities the measurement file
  # flags as wrong (keel and rudder both compute to 1000 kg/m^3). An inclining
  # test gives it directly. The arm is the sail CE above the centre of lateral
  # resistance: CE is 1.017 m above the waterline and the keel spans 0.110-0.810
  # below it, so roughly 1.47 m.
  # max_heeling_moment_nm: 30.0
  # heel_arm_m: 1.47
  x_pos: 0.267  # [m]    combined CE, 0.083 m forward of the keel CLR
  y_pos: 0.0
  # No NeuralFoil parameters: the ORC model never opens a section polar, so
  # alpha_min/alpha_max/res would do nothing. (Re on the measured 0.447 m mean
  # chord at 6 m/s apparent is 1.8e5, if a section model is ever fitted here.)
  # Sheet winch dynamics. The sail used to track its command instantly while the
  # rudder was rate-limited -- backwards, since a winch is far slower than a
  # rudder servo. Literature puts a sheet winch near 3 s.
  tau_s: 3.0            # [s]
  max_rate_deg_s: 60.0  # winch slew limit


windage:
  # Above-water drag: mast, rigging, topsides and deck gear. ORC treats this
  # separately from the sail coefficients, and leaving it out was measurable --
  # the rig's drag angle came out at 7.7 deg against a published 12-15.
  #
  # Measured 2026-09-16 by silhouette projection at 2 mm raster, everything at or
  # below the waterline removed. These are UNION areas, not sums: the components
  # overlap in projection, so the total is less than adding the rows.
  #   mast      0.0331 frontal / 0.0331 lateral   centroid 1.273 m above WL
  #   topsides  0.1082 / 0.2993                   centroid 0.097 m
  #   deck gear 0.0701 / 0.0737                   centroid 0.179 m
  frontal_area_m2: 0.1818
  lateral_area_m2: 0.3678
  drag_coefficient: 0.8   # ESTIMATE: bluff-body CD, the one unmeasured number here
  # Longitudinal centroid was not measured; topsides dominate the frontal area and
  # are spread along the hull, so 0.0 avoids inventing a yaw moment.
  x_pos: 0.0
  y_pos: 0.0
  # centroid_height_m: 0.342   # above WL; unused until the sim gains heel

rudder:
  airfoil_name: NACA0012
  model_type: finite_span
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [1.2e5]  # Re = V*c/nu at 1.5 m/s on the measured 0.082 m mean chord
  area: 0.0462  # [m²]    blade planform, stock excluded
  # Blade only. The CAD body spans 0.578 m but ~0.10 m of that is stock above
  # the blade, which is not a lifting surface. Geometric AR 4.95, not 6.94.
  span: 0.478   # [m]     blade span
  end_plate_factor: 1.0  # surface-piercing, no image
  x_pos: -0.227  # [m]    aft of the CG; arm 92 mm shorter against the real CG
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  # Retuned 0.2 -> 0.6 alongside the finite-span correction. The old value was a
  # hand-tuned stand-in for exactly that correction; keeping it would double-count
  # and the boat loses steerage (the audit measured the no-go pushed out to 57 deg).
  effectiveness: 0.6  # scale rudder force to avoid over-steer
  # Blending supersedes the aoa_limit_deg / cl_max / cd_max clamps: those pinned
  # the coefficients at a constant past stall and left a kink in the derivative
  # right where a stalled rudder operates.
  alpha_sep_deg: 25.0
  # Servo dynamics. tau_s is the first-order lag; the simulator solves it exactly
  # for a command held across the step, so it costs no integration accuracy.
  tau_s: 0.1            # [s] rudder servo, literature value for a boat this size
  max_rate_deg_s: 120.0 # servo slew limit
  # Both of the following are manual-helm aids and are OFF here. A deadband makes
  # small commands vanish, and an auto-centre moves the rudder the helm did not
  # ask for, so a learned policy cannot tell what its own action did.
  deadband_deg: 0.0
  center_tau_s: 0.0
