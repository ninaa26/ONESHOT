# RL waypoint training config for the Flingo Floaty hull.
#
# Observation scales re-derived 2026-09-17 from the measured polar, AFTER the
# hull calibration (c_wave 0.01 -> 0.05, yaw_damping_cd 7.0). That calibration
# moved both scales a long way, so the previous values no longer fit: the boat
# had been running to Fn 0.63 and 99 deg/s, neither of which a displacement
# hull does. Re-measured envelope is 1.80 m/s and 0.71 rad/s.
# Policies trained before this will not transfer: the polar, the observation
# scales and the observation width have all changed.
env:
  simulator_config: flingo_floty.yaml
  dt: 0.02
  max_episode_steps: 1750
  max_rudder_deg: 35.0
  max_sail_deg: 85.0
  initial_heading_range_deg: 30.0
  initial_speed_max: 0.2
  spawn_radius_m: 10.0
  waypoint_min_radius_m: 12.0
  waypoint_max_radius_m: 25.0
  upwind_waypoint_bias: 1
  upwind_half_angle_deg: 25.0
  success_radius_m: 1.5
  fail_radius_m: 80.0
  speed_scale: 2.1      # polar max measured 1.80 m/s (TWA 80) + ~17% headroom
  # Max yaw rate measured 0.71 rad/s (40 deg/s), swept over TWA 40-150 at 20 and
  # 35 deg rudder. The old 2.5 was set against a boat that could reach 1.77
  # rad/s; under the calibrated yaw damping it never gets close, so 2.5 squeezed
  # this observation into +-28% of its range and the policy saw almost no signal.
  yaw_rate_scale: 0.9
  wind_speed_scale: 15.0
  # The sheet winch lags 3 s; without this the policy sees only its own command.
  include_actuator_state: true
  vmg_multiplier: 1.0
  joint_penalty: 0.01
  dist_multiplier: 0.0
  time_penalty: 0.0
  stagnation_penalty: 0
  stagnation_u_threshold: 0.35
  no_go_zone_penalty: 0.3
  no_go_zone_half_angle_deg: 35.0  # measured no-go is 30-35 deg, best VMG at 40
  jibe_penalty: 0.5
  jibe_threshold_deg: 150.0
  surge_speed_bonus: 0.0
  surge_speed_bonus_cap_m_s: 6.0
  success_reward: 0.0
  failure_penalty: 0.0
train:
  vec_env: subproc
  total_timesteps: 750000
  device: cpu
  seed: 7
  n_envs: 4
  learning_rate: 0.0001
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  normalize_observation: false
  normalize_reward: false
  checkpoint_freq: 25000
  eval_freq: 10000
  eval_episodes: 10
  deterministic_eval: true
  tensorboard_log: runs/tensorboard
  watch_web: false
  watch_stride: 2
eval:
  episodes: 20
  deterministic: true
  render: false
