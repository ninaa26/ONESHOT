# Fun boat configuration - make sure to use quadratic drag hydro model

# The keel and rudder below carry an `assumed:` block. Nothing in one was measured
# for this boat: they are stand-ins that let it be sailed with the models that need
# keys this config never had (the `finite_span` foils). They sit one level down on
# purpose. As top-level keys they would be live parameters, and the basic models
# reject the richer models' keys outright rather than ignore them -- `model_type:
# basic` with a `span` beside it does not load. Nothing reads `assumed:` today; a
# consumer that switches a model merges the block in.
#
# The sail deliberately has no such block. This boat is a single-sail rig, so
# `orc_w_jib` is not a model it lacks data for -- it is the wrong model for the
# boat, and a jib_area here would be inventing rig geometry that does not exist.
# `orc_main` is the ORC sail for this boat.

simulation:
  dt: 0.02  # [s] solver step

environment:
  # Fluid densities. The hub injects these into every component, so this is the
  # only place either number is set; components no longer each default their own.
  rho_water: 1000.0  # [kg/m³]  fresh water
  rho_air: 1.225     # [kg/m³]  sea-level air

boat:
  mass: 27.0       # [kg]
  inertia_z: 10.0  # [kg·m²] yaw inertia

hull:
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  L: 1.5 # [m] length
  c_wave: 0.01   # residuary (wave-making) resistance; caps speed near 0.4*sqrt(g*L)
  B: 0.60 # [m] beam
  T: 0.05 # [m] draft

keel:
  # Thicker section (12%) gives better L/D at boat Re than NACA0006 (6%)
  airfoil_name: NACA0012
  model_type: basic
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [5e5]   # Reynolds number
  area: 0.75    # [m²]    planform area — larger = more lateral lift, less leeway
  x_pos: 0.0  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  # ASSUMED, not measured -- see the note at the top of this file.
  assumed:
    # An aspect ratio rather than a `span`: AR 4 on this 0.75 m2 planform implies
    # a 1.73 m span, longer than the 1.5 m hull it would hang under. These areas
    # were picked for feel, not struck off a drawing, so stating the AR keeps the
    # assumption in one honest number instead of inventing an impossible length.
    effective_aspect_ratio: 4.0  # generic fin keel, no end-plate credit
    alpha_sep_deg: 25.0          # stall onset ~15 deg, as in flingo_floty

sail:
  model_type: sail
  area: 3.0
  wind_speed: 5
  wind_dir_deg: 90  # direction wind blows TO (deg, 0=east, 90=north)
  x_pos: 0.0
  y_pos: 0.0
  luff_deg: 14
  luff_ramp_deg: 4.0
  #Basic sail model parameters
  airfoil_name: NACA0012
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [1e5]   # Reynolds number
  
rudder:
  airfoil_name: NACA0012
  model_type: basic
  alpha_min: -179 # Minimum and maximum angle of attack in degrees
  alpha_max: 179
  res: [5e5]
  area: 0.3    # [m²]    planform area (fin + bulb strut)
  x_pos: -0.3  # [m]     x position relative to boat center of rotation
  y_pos: 0.0  # [m]     y position relative to boat center of rotation
  effectiveness: 0.2  # scale rudder force to avoid over-steer
  aoa_limit_deg: 35.0  # clamp effective AoA for stalled rudder behavior
  cl_max: 1.0
  cd_max: 1.2
  deadband_deg: 1.5     # small stick noise -> zero command
  center_tau_s: 0.6     # time constant to return to center when cmd==0
  max_rate_deg_s: 120.0 # servo rate limit for manual controllability
  # ASSUMED, not measured -- see the note at the top of this file. These alone do
  # not make `finite_span` reachable on this rudder: that model also refuses the
  # aoa_limit_deg / cl_max / cd_max clamps above, which are live keys here.
  assumed:
    # An aspect ratio rather than a `span`: AR 4 on this 0.3 m2 blade implies a
    # 1.10 m span under a 1.5 m hull. flingo_floty's measured blade is 0.0462 m2
    # and 0.478 m -- the area here is a steering-feel number, not a drawing.
    effective_aspect_ratio: 4.0  # generic blade, surface-piercing
    alpha_sep_deg: 25.0          # stall onset ~15 deg, as in flingo_floty

  