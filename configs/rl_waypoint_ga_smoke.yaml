env:
  simulator_config: basic_sailbot.yaml
  dt: 0.02
  max_episode_steps: 200
  max_rudder_deg: 35.0
  max_sail_deg: 85.0
  initial_heading_range_deg: 30.0
  initial_speed_max: 0.2
  spawn_radius_m: 10.0
  waypoint_min_radius_m: 12.0
  waypoint_max_radius_m: 25.0
  success_radius_m: 1.5
  fail_radius_m: 80.0
  speed_scale: 6.0
  yaw_rate_scale: 2.0
  wind_speed_scale: 15.0
  vmg_multiplier: 1.0
  joint_penalty: 0.5
  dist_multiplier: 5.0
  time_penalty: 3.0
  success_reward: 25.0
  failure_penalty: -10.0

train:
  seed: 7
  generations: 2
  population_size: 12
  elite_count: 3
  parents_per_child: 2
  hidden_dim: 32
  num_hidden: 1
  episodes_per_candidate: 1
  device: cuda_if_available
  n_workers: 2
  init_std: 0.1
  combine_mutation_rate: 0.1
  combine_mutation_std: 0.1
  checkpoint_freq_gens: 1
