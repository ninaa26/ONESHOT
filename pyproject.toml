[project]
name = "sailbench"
version = "0.1.0"
description = "Sailbench base dependencies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "aerosandbox==4.2.8",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "websockets>=12.0",
    "tqdm>=4.67.1",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "lark>=1.3.1",
    "mypy>=1.19.1",
    "ruff>=0.14.9",
]

rl = [
    "gymnasium>=1.2.1",
    "stable-baselines3>=2.7.0",
    "torch>=2.8.0",
    "tensorboard>=2.20.0",
    "setuptools>=75.0.0,<81",
]


[tool.ruff]
line-length = 120
target-version = "py312"

select = [
    "ALL",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
