[project]
name = "sailbench"
version = "0.1.0"
description = "Sailbench base dependencies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "aerosandbox==4.2.8",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "websockets>=12.0",
    "tqdm>=4.67.1",
    "rich>=14.3.3",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "lark>=1.3.1",
    "mypy>=1.19.1",
    "ruff>=0.14.9",
]

rl = [
    "gymnasium>=1.2.1",
    "stable-baselines3>=2.7.0",
    "torch>=2.8.0",
    "tensorboard>=2.20.0",
    "setuptools>=75.0.0,<81",
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# `select` used to sit under `[tool.ruff]`, where modern ruff ignores it with a
# deprecation warning on every run -- so the gate was never really on. `ALL` also
# turns on rules that contradict each other and rules that fight pytest, which is
# why it stood at 900-odd violations and could not be used to block a merge.
#
# This set is the useful core: pycodestyle/pyflakes correctness, import order,
# naming, pyupgrade, bugbear, simplification, ruff's own checks, annotations and
# docstrings. It is enforceable at zero, which is the only property that matters
# for a gate.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
# D203/D213 contradict D211/D212; ruff wants one of each pair. COM812 fights the
# formatter over trailing commas.
# D203/D213 contradict D211/D212; ruff wants one of each pair. COM812 fights the
# formatter over trailing commas. RUF001 flags typographic characters as
# "ambiguous", but this codebase means them: m², kg·m², "9 x 12" printed as
# "9 × 12", and en dashes in ranges. Forcing ASCII would make the units and the
# console output worse, not clearer.
ignore = ["D203", "D213", "COM812", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Tests: `assert` is how pytest works, and a docstring per test case is noise.
# The docstring-style rules are relaxed too, because a test or fixture docstring
# is a noun phrase saying what the case is ("A keel carrying both models"), not
# imperative API documentation -- D401 would have every one of them reworded into
# something worse. RUF012 and N817 are for test-local constant tables and the
# `State as S` shorthand, neither of which is public API.
"test/*" = ["S101", "PLR2004", "D100", "D103", "D205", "D401", "D402", "ANN", "RUF012", "N817"]
# Scripts: a deliberate sys.path shuffle before imports, and print() is the UI.
"scripts/*" = ["E402", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
