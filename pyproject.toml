[project]
name = "sailbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "aerosandbox==4.2.8",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "textual>=8.0.0",
]

[dependency-groups]
dev = [
    "lark>=1.3.1",
    "mypy>=1.19.1",
    "ruff>=0.14.9",
]


[tool.ruff]
line-length = 120
target-version = "py312"

select = [
    "ALL",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
