env:
  simulator_config: basic_sailbot.yaml
  dt: 0.02
  max_episode_steps: 1000
  max_rudder_deg: 35.0
  max_sail_deg: 85.0
  initial_heading_range_deg: 30.0
  initial_speed_max: 0.2
  spawn_radius_m: 10.0
  waypoint_min_radius_m: 12.0
  waypoint_max_radius_m: 25.0
  upwind_waypoint_bias: 0.6
  upwind_half_angle_deg: 30.0
  success_radius_m: 1.5
  fail_radius_m: 80.0
  speed_scale: 6.0
  yaw_rate_scale: 2.0
  wind_speed_scale: 15.0
  vmg_multiplier: 1.0
  joint_penalty: 0.1
  dist_multiplier: 5.0
  time_penalty: 0.4
  stagnation_penalty: 0
  stagnation_u_threshold: 0.35
  surge_speed_bonus: 0.0
  surge_speed_bonus_cap_m_s: 6.0
  success_reward: 25.0
  failure_penalty: -10.0
train:
  vec_env: subproc
  total_timesteps: 600000
  device: cpu
  seed: 7
  n_envs: 4
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  normalize_observation: false
  normalize_reward: false
  checkpoint_freq: 25000
  eval_freq: 10000
  eval_episodes: 10
  deterministic_eval: true
  tensorboard_log: runs/tensorboard
  watch_web: false
  watch_stride: 2
eval:
  episodes: 20
  deterministic: true
  render: false
