<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sailbench – CUSail Simulation Software</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: radial-gradient(circle at top, #1e3c72, #090909);
        color: #e8f0ff;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }

      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(5, 10, 30, 0.72);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
        border: 1px solid rgba(120, 190, 255, 0.3);
        font-size: 13px;
        line-height: 1.5;
        max-width: 280px;
      }

      .hud h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9cd5ff;
      }

      .hud-row {
        display: flex;
        justify-content: space-between;
      }

      .hud-label {
        opacity: 0.75;
      }

      .hud-value {
        font-variant-numeric: tabular-nums;
        margin-left: 12px;
      }

      .hud-help {
        margin-top: 6px;
        opacity: 0.7;
        font-size: 11px;
      }

      .forces-section {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(120, 190, 255, 0.2);
      }

      .forces-section h2 {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: #9cd5ff;
        cursor: pointer;
        user-select: none;
      }

      .forces-section h2:hover {
        opacity: 0.9;
      }

      .forces-section.collapsed .forces-chart {
        display: none;
      }

      .forces-chart {
        font-size: 11px;
      }

      .forces-chart-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .forces-chart-label {
        width: 48px;
        flex-shrink: 0;
      }

      .forces-chart-bars {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }

      .forces-chart-bar-wrap {
        flex: 1;
        height: 8px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 2px;
        overflow: hidden;
        min-width: 20px;
      }

      .forces-chart-bar {
        height: 100%;
        transition: width 0.1s;
      }

      .forces-chart-val {
        width: 28px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 10px;
      }

    </style>
  </head>

  <body>
    <div id="app">
      <div class="hud">
        <h1>sailbench</h1>
        <div class="hud-row">
          <span class="hud-label">Speed</span>
          <span class="hud-value" id="hud-speed">0.0 m/s</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Heading</span>
          <span class="hud-value" id="hud-heading">0°</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Sail angle</span>
          <span class="hud-value" id="hud-sail-angle">0°</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Rudder angle</span>
          <span class="hud-value" id="hud-rudder-angle">0°</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Sail force</span>
          <span class="hud-value" id="hud-sail-force">Fx 0.0 N, Fy 0.0 N</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Connection</span>
          <span class="hud-value" id="hud-conn">disconnected</span>
        </div>
        <div class="hud-row">
          <span class="hud-label">Control mode</span>
          <span class="hud-value" id="hud-control-mode">manual</span>
        </div>
        <div class="hud-help">
          Rudder: ←/→ or A/D · Sail: ↑/↓ or W/S · F: Forces · C: Cam
        </div>
        <div class="forces-section" id="forces-section">
          <h2 id="forces-toggle">Forces (Fx, Fy) ▼</h2>
          <div class="forces-chart" id="hud-forces-chart">
            <span class="hud-label">No forces</span>
          </div>
        </div>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
